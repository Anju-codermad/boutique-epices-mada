name: Déploiement Cloudflare

# Déploie le site sur Cloudflare Workers depuis les serveurs de GitHub (dont l'accès réseau à
# api.cloudflare.com et à Supabase n'est pas restreint). Déclenché à chaque push sur main, ou
# manuellement depuis l'onglet Actions (« Run workflow »).
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — compte Cloudflare
#   HYPERDRIVE_ID — identifiant de la configuration Hyperdrive (créée dans le tableau de bord
#                   Cloudflare, Storage & Databases → Hyperdrive)
#   DATABASE_URL  — Supabase, « Session pooler » (port 5432) : sert aux migrations Prisma (les
#                   runners GitHub n'ont pas d'IPv6, la connexion directe Supabase ne passe pas)
# Secrets facultatifs, transmis au Worker s'ils sont définis : voir l'étape « Secrets du Worker ».
#
# ⚠️ Jamais de `prisma db seed` ici : uniquement `migrate deploy` (voir CLAUDE.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier les secrets requis
        env:
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HYPERDRIVE_ID DATABASE_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets GitHub manquants :$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Injecter l'identifiant Hyperdrive
        env:
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
        run: |
          sed -i "s/placeholder-hyperdrive-id-a-remplacer-avant-deploiement/${HYPERDRIVE_ID}/" wrangler.jsonc
          grep -q "$HYPERDRIVE_ID" wrangler.jsonc

      - name: Appliquer les migrations (Supabase)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Créer le bucket R2 du cache (si absent)
        run: |
          if npx wrangler r2 bucket info boutique-epices-mada-opennext-cache >/dev/null 2>&1; then
            echo "Bucket déjà présent."
          else
            npx wrangler r2 bucket create boutique-epices-mada-opennext-cache
          fi

      - name: Build et déploiement
        env:
          # Variables publiques : intégrées au code client au moment du build.
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}
        run: npm run cf:deploy

      - name: Secrets du Worker
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          # Ne transmet que les secrets définis ; un secret absent laisse la valeur actuelle du
          # Worker inchangée (et la fonctionnalité correspondante reste désactivée).
          jq -n 'env | with_entries(select(.key | IN(
            "AUTH_SECRET","RESEND_API_KEY","EMAIL_FROM","CONTACT_EMAIL","NEXT_PUBLIC_APP_URL",
            "STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","NEXT_PUBLIC_SUPABASE_URL",
            "SUPABASE_SERVICE_ROLE_KEY","SENTRY_DSN","UPSTASH_REDIS_REST_URL",
            "UPSTASH_REDIS_REST_TOKEN")) | select(.value != ""))' > "$RUNNER_TEMP/worker-secrets.json"
          if [ "$(jq length "$RUNNER_TEMP/worker-secrets.json")" -gt 0 ]; then
            npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          else
            echo "Aucun secret facultatif défini."
          fi
          rm -f "$RUNNER_TEMP/worker-secrets.json"
